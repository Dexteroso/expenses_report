server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /portfolio {
    try_files /index.html =404;
  }

  location = /portfolio/ {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
